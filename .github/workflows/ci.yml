name: Build check

# Just makes sure the tree still builds -- no packaging, no release.
# release.yml handles that on push to main; this is for pull requests
# and pushes to other branches, so a broken build gets caught before it
# ever reaches main.

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libadwaita-1-dev gettext

      - name: Build
        run: make
